version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Supply-chain buffer: let new releases age before they're proposed.
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      runtime-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # The Expo SDK pins compatible versions of these. Upgrade them together, by hand:
      # `npx expo install expo@^<sdk> --fix` (see README).
      - dependency-name: "expo"
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: "expo-*"
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: "@expo/*"
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: "jest-expo"
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: "eslint-config-expo"
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: "react-native"
      # Expo pins these to exact versions per SDK; even a patch bump fails expo-doctor.
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-worklets"
      - dependency-name: "react-native-*"
        update-types: [version-update:semver-minor, version-update:semver-major]
      # eslint-config-expo's plugins (react, import) don't support ESLint 10 yet.
      - dependency-name: "eslint"
        update-types: [version-update:semver-major]
      # Node types follow .node-version (24).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # Jest major must match what jest-expo supports.
      - dependency-name: "jest"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/jest"
        update-types: [version-update:semver-major]
      # TypeScript version follows the Expo SDK; bump with it.
      - dependency-name: typescript
        update-types: [version-update:semver-minor, version-update:semver-major]
